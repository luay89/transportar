<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transportar</title>
<meta name="description" content="Scan, book and ride: chauffeured airport, hourly and event transportation with upfront prices, live tracking and card, POS or bank payment.">
<meta name="theme-color" content="#0f8b7f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<!--APP-->
<header class="topbar">
  <div class="wrap">
    <a class="logo" href="#book"><span class="logo-mark" id="logoMark"></span><span id="brandName">Transportar</span></a>
    <nav class="nav"><a id="navBook" href="#book">Book</a><a id="navTrips" href="#trips">My account</a></nav>
    <button class="btn sm" id="installBtn" hidden>Install</button>
    <button type="button" class="icon-btn theme-btn" id="themeBtn"></button>
    <select id="langSel" aria-label="Language"><option value="en">EN</option><option value="es">ES</option><option value="ar">عربي</option></select>
  </div>
</header>
<div class="demo-bar" id="demoBar" hidden></div>
<main id="main" class="wrap"><p class="muted">Loading…</p></main>
<footer><div class="wrap" id="footer"></div></footer>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sheet-card" id="sheetBody"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<!--/APP-->
<script src="/vendor/qrcode.js"></script>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/core/util.js"></script>
<script src="/core/pricing.js"></script>
<script src="/core/dispatch.js"></script>
<script src="/core/nlp.js"></script>
<script src="/core/analytics.js"></script>
<script src="/core/core.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/base.js"></script>
<script src="/js/map.js"></script>
<script src="/js/book.js"></script>
<script src="/js/track.js"></script>
<script src="/js/driver.js"></script>
<script src="/js/admin.js"></script>
<script src="/js/platform.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
