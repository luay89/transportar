<title>Transportar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* Calm, trustworthy palette: deep sea-glass teal on soft slate, warm sunrise highlights.
 * --brand is each company's own color (white label); everything accented follows it. */
:root {
  --brand: #0f8b7f; --brand-ink: #ffffff; --sun: #f4b04f; --sky: #4c8dd6;
  --bg: #0b1418; --surface: #111d22; --surface-2: #172630; --surface-3: #1e313b; --line: #213540; --line-2: #2d4552;
  --fg: #e7f0f1; --muted: #93a8af; --faint: #627880;
  --accent: var(--brand); --accent-ink: var(--brand-ink); --link: color-mix(in srgb, var(--brand) 70%, #fff);
  --soft: color-mix(in srgb, var(--brand) 14%, var(--surface));
  --go: #3cc48e; --bad: #f07a6c; --info: #6eaef0; --warn: #f4b04f;
  --map-bg: #0f1c22; --map-land: #132430; --map-water: #10303d; --map-road: #1d3542; --map-grid: #18292f;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -22px rgba(0,0,0,.7);
  --shadow-lg: 0 30px 60px -28px rgba(0,0,0,.8);
  --font-display: 'Overpass', 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --font-body: 'Overpass', 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --font-mono: 'Overpass Mono', ui-monospace, Menlo, monospace;
  --r: 18px; --r-sm: 12px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f7f6; --surface: #ffffff; --surface-2: #f0f5f4; --surface-3: #e5eeec; --line: #dce7e5; --line-2: #c5d5d2;
    --fg: #10212a; --muted: #566a72; --faint: #8a9ca2;
    --link: color-mix(in srgb, var(--brand) 80%, #10212a);
    --soft: color-mix(in srgb, var(--brand) 9%, #fff);
    --go: #16875a; --bad: #c43d2f; --info: #2a6ab0; --warn: #a76a06;
    --map-bg: #eaf2f1; --map-land: #f6faf9; --map-water: #cfe6ef; --map-road: #ffffff; --map-grid: #e1ebea;
    --shadow: 0 1px 2px rgba(16,40,48,.05), 0 14px 32px -20px rgba(16,40,48,.28);
    --shadow-lg: 0 30px 60px -30px rgba(16,40,48,.4);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f7f6; --surface: #ffffff; --surface-2: #f0f5f4; --surface-3: #e5eeec; --line: #dce7e5; --line-2: #c5d5d2;
  --fg: #10212a; --muted: #566a72; --faint: #8a9ca2;
  --link: color-mix(in srgb, var(--brand) 80%, #10212a);
  --soft: color-mix(in srgb, var(--brand) 9%, #fff);
  --go: #16875a; --bad: #c43d2f; --info: #2a6ab0; --warn: #a76a06;
  --map-bg: #eaf2f1; --map-land: #f6faf9; --map-water: #cfe6ef; --map-road: #ffffff; --map-grid: #e1ebea;
  --shadow: 0 1px 2px rgba(16,40,48,.05), 0 14px 32px -20px rgba(16,40,48,.28);
  --shadow-lg: 0 30px 60px -30px rgba(16,40,48,.4);
  color-scheme: light;
}
[lang="ar"] { --font-display: 'IBM Plex Sans Arabic', 'Overpass', system-ui, sans-serif; --font-body: 'IBM Plex Sans Arabic', 'Overpass', system-ui, sans-serif; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: radial-gradient(900px 520px at 100% -8%, color-mix(in srgb, var(--brand) 11%, transparent), transparent 62%), radial-gradient(700px 420px at -10% 40%, color-mix(in srgb, var(--sky) 6%, transparent), transparent 60%), var(--bg); background-attachment: fixed; color: var(--fg); font: 16px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: var(--link); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.6rem, 4.5vw, 2.6rem); font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.2rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
h3 { font-size: 1rem; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
p { margin: 0; }
.eyebrow { margin: 0 0 6px; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.muted, .fine { color: var(--muted); }
.fine { font-size: .85rem; }
.mono, .code, .num, .plate { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { text-align: end; white-space: nowrap; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.grow { flex: 1; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; margin-top: 12px; }
.grid2, .grid3, .grid4 { display: grid; gap: 12px; }
.grid2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.grid3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
.grid4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.two { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }

/* ---------- shell ---------- */
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }
.topbar { position: sticky; top: 0; z-index: 30; padding-top: env(safe-area-inset-top, 0px); background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; margin-inline-end: auto; min-width: 0; }
.logo > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.logo-mark { flex: none; width: 34px; height: 34px; border-radius: 9px; background: var(--brand); display: grid; place-items: center; color: var(--brand-ink); overflow: hidden; }
.logo-mark.img { background: #fff; }
.logo-mark img { width: 100%; height: 100%; object-fit: contain; }
.nav { display: flex; gap: 2px; }
.nav a { color: var(--muted); text-decoration: none; padding: 8px 10px; border-radius: 8px; font-weight: 700; font-size: .92rem; white-space: nowrap; }
.nav a[aria-current="page"] { color: var(--fg); background: var(--surface-2); }
select, input, textarea { font: inherit; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; min-width: 0; width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
input[type="color"] { padding: 4px; height: 44px; width: 64px; }
#langSel { width: auto; padding: 6px 8px; }
.demo-bar { background: color-mix(in srgb, var(--brand) 12%, var(--surface)); border-bottom: 1px solid var(--line); font-size: .85rem; color: var(--muted); display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; padding: 8px 16px; text-align: center; }
main { padding-block: 22px 120px; display: block; min-height: 60vh; }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; background: var(--surface); }
footer .wrap { display: flex; flex-wrap: wrap; gap: 16px 32px; padding-block: 26px 40px; }
.foot-brand, .foot-contact { display: flex; flex-direction: column; gap: 2px; }
.foot-brand strong { color: var(--fg); font-family: var(--font-display); }
.foot-links { display: flex; gap: 8px 18px; margin-inline-start: auto; flex-wrap: wrap; }
.foot-links a { color: var(--muted); text-decoration: none; font-weight: 600; }
.foot-links a:hover { color: var(--fg); }

/* ---------- buttons, chips, pills ---------- */
.btn { font: inherit; font-weight: 700; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); padding: 10px 18px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; transition: border-color .15s, filter .15s, transform .05s; }
.btn:hover { border-color: var(--line-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.primary.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.sm { padding: 6px 12px; min-height: 34px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: wait; }
.btn.wallet { background: #000; color: #fff; border-color: #000; flex: 1; font-size: 1.05rem; }
.link { background: none; border: 0; color: var(--link); font: inherit; font-size: .85rem; cursor: pointer; padding: 0 4px; font-weight: 600; }
.icon-btn { flex: none; width: 46px; min-height: 44px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface-2); color: var(--accent); font-size: 1.3rem; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips-lbl { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; margin-inline-end: 4px; }
.chip { font: inherit; font-size: .85rem; font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 999px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--line-2); }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.ptype { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.ptype.t-airport { background: var(--info); } .ptype.t-hotel { background: var(--brand); } .ptype.t-venue { background: var(--go); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .75rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-3); color: var(--muted); white-space: nowrap; }
.pill.big { font-size: .9rem; padding: 6px 14px; }
.st-pending, .st-offered { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.st-accepted, .st-enroute, .st-arrived, .st-ontrip, .pay-transfer_sent, .fl-active { background: color-mix(in srgb, var(--info) 18%, transparent); color: var(--info); }
.st-completed, .pay-paid, .fl-landed, .fl-scheduled { background: color-mix(in srgb, var(--go) 18%, transparent); color: var(--go); }
.st-cancelled, .fl-cancelled, .fl-delayed, .fl-diverted { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.pay-unpaid { background: var(--surface-3); color: var(--muted); }
.pill.tier { background: linear-gradient(135deg, color-mix(in srgb, var(--brand) 80%, #fff), var(--brand)); color: var(--brand-ink); }
.pill.ai { background: linear-gradient(135deg, #8b6cf0, #4fa3f7); color: #fff; }
.badge { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--brand); color: var(--brand-ink); font-size: .75rem; font-weight: 800; font-family: var(--font-mono); }
.note { padding: 12px 14px; border-radius: var(--r-sm); background: var(--surface-2); border-inline-start: 3px solid var(--info); font-size: .92rem; }
.note.good { border-color: var(--go); } .note.bad { border-color: var(--bad); color: var(--fg); }
.form-error { color: var(--bad); font-weight: 600; margin: 10px 0; }
.toggle { display: flex; gap: 10px; align-items: center; cursor: pointer; font-size: .95rem; padding: 6px 0; }
.toggle input { width: 20px; height: 20px; accent-color: var(--brand); flex: none; }

/* ---------- form fields ---------- */
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld > span:first-child { font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.fld .row { flex-wrap: nowrap; }
.fld-msg { font-size: .8rem; min-height: 1em; }
.fld-msg.good { color: var(--go); } .fld-msg.bad { color: var(--bad); }
.fld.color { flex-direction: row; align-items: center; gap: 10px; }
.fs { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px 14px; margin: 14px 0; display: grid; gap: 10px; min-width: 0; }
.fs legend { font-weight: 700; font-size: .85rem; padding: 0 6px; color: var(--muted); }
.checks { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 3px; gap: 3px; }
.seg button { font: inherit; font-weight: 700; font-size: .9rem; background: none; border: 0; color: var(--muted); padding: 8px 14px; border-radius: 7px; cursor: pointer; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.seg.narrow { margin-top: 12px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); width: max-content; }
.stepper button { font: inherit; font-size: 1.2rem; width: 44px; height: 44px; background: none; border: 0; color: var(--fg); cursor: pointer; }
.stepper output { min-width: 34px; text-align: center; font-family: var(--font-mono); font-weight: 700; font-size: 1.05rem; }

/* ---------- booking ---------- */
.hero { position: relative; padding: 28px 22px 30px; margin-bottom: 18px; border-radius: 20px; overflow: hidden;
  background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--brand) 22%, transparent), transparent 55%), linear-gradient(180deg, var(--surface), var(--bg)); border: 1px solid var(--line); }
.hero h1 { font-size: clamp(1.9rem, 5.2vw, 3.1rem); letter-spacing: -0.02em; max-width: 18ch; }
.welcome { display: inline-block; margin-bottom: 12px; padding: 6px 12px; border-radius: 999px; background: var(--brand); color: var(--brand-ink); font-weight: 800; font-size: .9rem; }
.lede { font-size: 1.08rem; color: var(--muted); max-width: 56ch; margin: 12px 0 16px; }
.perks { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px 18px; font-weight: 600; font-size: .92rem; }
.perks li { display: inline-flex; align-items: center; gap: 6px; }
.perks .ic { color: var(--brand); width: 18px; height: 18px; padding: 2px; border-radius: 50%; background: color-mix(in srgb, var(--brand) 16%, transparent); }
.assist { background: var(--surface); border: 1px solid color-mix(in srgb, #8b6cf0 45%, var(--line)); border-radius: var(--r); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.assist-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.assist-row { display: flex; gap: 8px; margin-top: 10px; align-items: stretch; }
.assist-row textarea { resize: vertical; min-height: 48px; }
.assist-reply { margin-top: 10px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); font-size: .92rem; }
.favs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 14px; }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.block > h2 { margin-bottom: 14px; }
.step { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--brand); color: var(--brand-ink); font-family: var(--font-mono); font-size: .9rem; flex: none; }
.svc-tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 8px; }
.svc-tabs button { font: inherit; text-align: start; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; color: var(--fg); cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.svc-tabs button small { color: var(--muted); font-size: .8rem; line-height: 1.3; }
.svc-tabs button[aria-checked="true"] { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 12%, var(--surface-2)); box-shadow: 0 0 0 1px var(--brand) inset; }
.route-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) { .route-grid { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); } }
.route-fields { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.swap { align-self: flex-end; margin: -6px 0; width: 36px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); cursor: pointer; }
.airport-extras { display: grid; gap: 8px; padding: 12px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px dashed var(--line-2); }
.trip-opts { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: flex-start; }
.trip-opts .fld { min-width: 180px; }
.trip-opts .row select { width: auto; }
.vehicles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
.vcard { font: inherit; color: var(--fg); text-align: start; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; position: relative; transition: border-color .15s, transform .15s; }
.vcard:hover { border-color: var(--line-2); transform: translateY(-1px); }
.vcard[aria-checked="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset, 0 10px 24px -14px color-mix(in srgb, var(--brand) 60%, transparent); }
.vcard[aria-checked="true"]::after { content: '✓'; position: absolute; top: 10px; inset-inline-end: 10px; width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 800; font-size: .8rem; }
.vcard.dim { opacity: .55; }
.vart { height: 92px; display: grid; place-items: center; border-radius: var(--r-sm); background: radial-gradient(80% 90% at 50% 100%, color-mix(in srgb, var(--brand) 14%, transparent), transparent 70%), var(--surface-3); overflow: hidden; }
.veh { width: 82%; max-height: 80px; }
[dir="rtl"] .veh { transform: scaleX(-1); }
.veh-body { fill: var(--fg); opacity: .92; } .veh-win { fill: var(--surface-3); } .veh-tire { fill: #0b0c0f; } .veh-hub { fill: var(--muted); }
.veh-photo { width: 100%; height: 100%; object-fit: cover; }
.vtop { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-inline-end: 26px; }
.vname { font-weight: 800; font-family: var(--font-display); }
.vprice { font-family: var(--font-mono); font-weight: 700; color: var(--link); white-space: nowrap; }
.vprice.exact { font-size: 1.1rem; }
.vdesc { font-size: .82rem; color: var(--muted); }
.vmeta { display: flex; gap: 12px; font-size: .85rem; color: var(--muted); }
.vfeat { display: flex; flex-wrap: wrap; gap: 4px; }
.vfeat i { font-style: normal; font-size: .72rem; padding: 2px 7px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.vwarn { font-size: .8rem; color: var(--bad); font-weight: 700; }
.member { margin: 12px 0; padding: 12px 14px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--brand) 10%, var(--surface-2)); border: 1px solid color-mix(in srgb, var(--brand) 35%, var(--line)); display: grid; gap: 4px; }
.pay-opts { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); margin-top: 12px; }
.pay { font: inherit; color: var(--fg); text-align: start; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.pay span { font-size: .82rem; color: var(--muted); }
.pay[aria-checked="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
.bar { position: sticky; bottom: max(10px, env(safe-area-inset-bottom)); z-index: 20; display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 10px 10px 16px;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line-2); border-radius: 16px; box-shadow: 0 16px 40px -12px rgba(0,0,0,.55); }
.bar-price { font: inherit; color: var(--fg); background: none; border: 0; text-align: start; cursor: pointer; display: flex; flex-direction: column; padding: 0; min-width: 0; }
.bar-price small { color: var(--muted); font-size: .75rem; }
.bar-price strong { font-family: var(--font-mono); font-size: 1.6rem; line-height: 1.1; }
.bar-breakdown { margin-top: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; }
.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--brand); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* ---------- map ---------- */
.map { border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--map-bg); min-height: 220px; position: relative; }
.map.tall { min-height: 340px; }
.map-svg { display: block; width: 100%; height: auto; }
.map-svg .grid { stroke: var(--map-grid); stroke-width: 1; }
.map-svg .dot { fill: var(--faint); }
.map-svg .lbl { fill: var(--muted); font: 11px var(--font-body); }
.map-svg .lbl.strong { fill: var(--fg); font-weight: 700; }
.map-svg .route { stroke: var(--brand); stroke-width: 3; stroke-dasharray: 10 8; }
.map-svg .pin-a circle, .map-svg .pin-b circle { stroke: var(--map-bg); stroke-width: 3; }
.map-svg .pin-a circle { fill: var(--go); } .map-svg .pin-b circle { fill: var(--bad); }
.map-svg .pin-a text, .map-svg .pin-b text { fill: #fff; font: 800 11px var(--font-mono); text-anchor: middle; }
.map-svg .pin-car circle { fill: var(--brand); stroke: var(--map-bg); stroke-width: 2; }
.map-svg .pin-car.busy circle { fill: var(--info); }
.map-svg .pin-car .pulse { fill: color-mix(in srgb, var(--brand) 30%, transparent); stroke: none; animation: pulse 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { from { transform: scale(.5); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
.map-empty { display: grid; place-items: center; min-height: 220px; color: var(--muted); font-size: .9rem; }
.map .lf-map { position: absolute; inset: 0; }
.lf-pin { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; color: #fff; font: 800 12px var(--font-mono); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
.lf-pin.a { background: var(--go); } .lf-pin.b { background: var(--bad); }
.lf-pin.car { background: var(--brand); width: 20px; height: 20px; margin: 3px; }
.lf-pin.car.busy { background: var(--info); }
.lf-route { stroke: var(--brand); }
.lf-label { font: 700 12px var(--font-body); }

/* ---------- tracking ---------- */
.track-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.code { font-size: clamp(1.8rem, 6vw, 2.6rem); letter-spacing: .02em; }
.track-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .track-grid { grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); } }
.track-grid .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.timeline { list-style: none; margin: 0; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: grid; }
.timeline li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-block: 8px; padding-inline: 28px 0; position: relative; color: var(--faint); font-weight: 600; }
.timeline li::before { content: ''; position: absolute; inset-inline-start: 6px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; border: 2px solid var(--line-2); background: var(--surface); z-index: 1; }
.timeline li:not(:last-child)::after { content: ''; position: absolute; inset-inline-start: 11px; top: calc(50% + 6px); height: 100%; width: 2px; background: var(--line); }
.timeline li.done { color: var(--fg); }
.timeline li.done::before { background: var(--go); border-color: var(--go); }
.timeline li.done:not(:last-child)::after { background: var(--go); }
.timeline li.cur::before { background: var(--brand); border-color: var(--brand); box-shadow: 0 0 0 5px color-mix(in srgb, var(--brand) 25%, transparent); }
.timeline li.cur { color: var(--fg); font-weight: 800; }
.timeline time { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.flight-card, .driver-card, .pay-box, .rate-box, .series, .panel, .receipt { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.flight-card { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; border-inline-start: 4px solid var(--info); }
.flight-card > div { display: flex; flex-direction: column; gap: 2px; }
.flight-card small, .driver-card small, .eta small { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.flight-card p { flex-basis: 100%; }
.driver-card { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.driver-card > div:nth-child(2) { display: flex; flex-direction: column; flex: 1; min-width: 140px; }
.avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), color-mix(in srgb, var(--brand) 55%, #000)); color: var(--brand-ink); display: grid; place-items: center; font-weight: 800; font-size: 1.3rem; flex: none; }
.plate { display: inline-block; margin-top: 4px; padding: 2px 8px; border: 2px solid var(--fg); border-radius: 5px; font-size: .8rem; font-weight: 700; width: max-content; }
.eta { display: flex; flex-direction: column; }
.eta strong { font-family: var(--font-mono); font-size: 1.4rem; color: var(--link); }
.stars-sm { color: var(--sun); font-size: .85rem; }
.summary { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.summary dt { color: var(--muted); font-size: .85rem; }
.summary dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.sheet .summary, .receipt .summary { background: none; border: 0; padding: 0; }
.breakdown { width: 100%; border-collapse: collapse; font-size: .92rem; }
.breakdown td { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.breakdown .sub td { color: var(--muted); }
.breakdown .disc td { color: var(--go); }
.breakdown .tot td { border-bottom: 0; font-weight: 800; font-size: 1.1rem; padding-top: 10px; }
.pay-box { display: grid; gap: 10px; }
.bank { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
.bank dt { color: var(--muted); font-size: .85rem; }
.bank dd { margin: 0; overflow-wrap: anywhere; }
.wallets { display: flex; gap: 6px; flex-wrap: wrap; }
.wallets span { font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); }
.wallet-row { display: flex; gap: 8px; margin: 4px 0; }
.or { text-align: center; color: var(--muted); font-size: .85rem; }
.rate-box { display: grid; gap: 10px; border-color: color-mix(in srgb, var(--brand) 50%, var(--line)); }
.stars { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stars button { font-size: 1.9rem; line-height: 1; background: none; border: 0; color: var(--line-2); cursor: pointer; padding: 2px; }
.stars button[aria-pressed="true"] { color: var(--sun); }
.series ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.series li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .9rem; }
.series li span { flex: 1; color: var(--muted); }

/* receipt */
.receipt { max-width: 720px; margin: 0 auto; display: grid; gap: 18px; }
.receipt header { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 2px solid var(--fg); }
.r-logo { height: 48px; margin-bottom: 6px; }
.r-meta { text-align: end; display: flex; flex-direction: column; }
.r-meta strong { font-size: 1.3rem; }

/* account */
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); margin-bottom: 16px; }
.kpis.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow); min-width: 0; }
.kpi small { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.kpi strong { font-family: var(--font-mono); font-size: 1.6rem; line-height: 1.2; overflow-wrap: anywhere; }
.kpi span { color: var(--muted); font-size: .8rem; }
.panel { margin-bottom: 16px; min-width: 0; }
.panel h3 { margin-bottom: 10px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.panel-head h3 { margin: 0; }
.progress { height: 10px; border-radius: 999px; background: var(--surface-3); overflow: hidden; margin: 8px 0; }
.progress i { display: block; height: 100%; width: var(--w); background: var(--brand); border-radius: inherit; }
.tiers { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; }
.tiers li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); font-size: .9rem; }
.tiers li span { color: var(--muted); }
.tiers li.on { background: color-mix(in srgb, var(--brand) 16%, var(--surface-2)); box-shadow: 0 0 0 1px var(--brand) inset; }
.refcode { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 12px; border: 2px dashed var(--brand); border-radius: var(--r-sm); justify-content: space-between; }
.refcode strong { font-size: 1.5rem; letter-spacing: .12em; }
.mini, .trip-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.mini li { display: flex; gap: 10px; align-items: center; }
.mini li span:nth-child(2) { flex: 1; }
.trip-list a { display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--fg); text-decoration: none; font-size: .9rem; }
.trip-list a:hover { background: var(--surface-3); }
@media (max-width: 640px) { .trip-list a { grid-template-columns: 1fr auto; } }

/* login */
.login { max-width: 400px; margin: 6vh auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 26px 22px; box-shadow: var(--shadow); }
.login h1 { font-size: 1.6rem; margin-bottom: 18px; }
.login form { display: grid; gap: 14px; }
.login .fine { margin-top: 14px; }
.steps { padding-inline-start: 20px; display: grid; gap: 6px; margin: 0; }

/* ---------- operations (owner, company, platform) ---------- */
.ops-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.subnav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 18px; padding: 4px 16px 10px; border-bottom: 1px solid var(--line); }
.subnav::-webkit-scrollbar { display: none; }
.subnav a { flex: none; padding: 8px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 700; font-size: .9rem; white-space: nowrap; }
.subnav a:hover { color: var(--fg); background: var(--surface-2); }
.subnav a[aria-current="page"] { background: var(--brand); color: var(--brand-ink); }
.toolbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar input[type="search"] { max-width: 320px; }
.table-wrap { overflow-x: auto; margin: 0 -4px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .88rem; }
.tbl th { text-align: start; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td small { color: var(--muted); }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--surface-2); }
.tbl.edit td { padding: 4px; }
.tbl.edit input, .tbl.edit select { padding: 6px 8px; font-size: .85rem; min-width: 70px; }
.tbl td.row { display: flex; flex-wrap: nowrap; }
.dispatch-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) { .dispatch-grid { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); } }
.dispatch-grid .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.dispatch-grid .panel { margin: 0; }
.disp-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.disp-card { font: inherit; color: var(--fg); width: 100%; text-align: start; display: grid; grid-template-columns: auto auto 1fr; gap: 4px 10px; align-items: center; padding: 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
.disp-card strong { justify-self: end; }
.disp-card .r, .disp-card .fine, .disp-card > .pill:last-child { grid-column: 1 / -1; }
.disp-card > .pill:last-child { justify-self: start; }
.disp-card.on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
.cands { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 6px; }
.cands li { display: grid; grid-template-columns: 28px 1fr auto auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.cands b { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: var(--surface-3); font-family: var(--font-mono); font-size: .8rem; }
.cands li:first-child b { background: var(--brand); color: var(--brand-ink); }
@media (max-width: 520px) { .cands li { grid-template-columns: 28px 1fr auto; } .cands li .fine { grid-column: 2; } }
.drv-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.drv-list li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); font-size: .9rem; }
.drv-list li > span:nth-child(2) { font-weight: 700; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot.free { background: var(--go); box-shadow: 0 0 0 3px color-mix(in srgb, var(--go) 25%, transparent); }
.dot.busy { background: var(--info); } .dot.off { background: var(--faint); }

/* charts: one hue (the brand color), recessive grid, hover tooltips */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .bar { fill: var(--brand); }
.chart g:hover .bar, .chart g:focus .bar { filter: brightness(1.15); }
.chart .hit { fill: transparent; }
.chart g:hover .hit { fill: color-mix(in srgb, var(--fg) 5%, transparent); }
.chart .gridline { stroke: var(--line); stroke-dasharray: 2 4; }
.chart .baseline { stroke: var(--line-2); }
.chart .axis { fill: var(--muted); font: 10px var(--font-mono); }
.chart g:focus { outline: none; }
.chart-tip { position: fixed; z-index: 60; pointer-events: none; background: var(--fg); color: var(--bg); padding: 6px 10px; border-radius: 8px; font-size: .8rem; line-height: 1.35; box-shadow: 0 8px 20px rgba(0,0,0,.35); max-width: 260px; }
.hbars { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.hbars li { display: grid; grid-template-columns: minmax(90px, 38%) 1fr auto; gap: 10px; align-items: center; font-size: .88rem; }
.hbars .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbars .track { height: 12px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.hbars .track i { display: block; height: 100%; width: var(--w); background: var(--brand); border-radius: 0 4px 4px 0; }
[dir="rtl"] .hbars .track i { border-radius: 4px 0 0 4px; }
.heat { display: grid; gap: 3px; overflow-x: auto; padding-bottom: 4px; }
.heat-row { display: grid; grid-template-columns: 40px repeat(24, minmax(10px, 1fr)); gap: 3px; align-items: center; min-width: 360px; }
.heat .dl, .heat .hl { font-size: .68rem; color: var(--muted); font-family: var(--font-mono); white-space: nowrap; }
.cell { aspect-ratio: 1; border-radius: 3px; display: block; }
.cell.h0 { background: var(--surface-2); }
.cell.h1 { background: color-mix(in srgb, var(--brand) 18%, var(--surface-2)); }
.cell.h2 { background: color-mix(in srgb, var(--brand) 36%, var(--surface-2)); }
.cell.h3 { background: color-mix(in srgb, var(--brand) 56%, var(--surface-2)); }
.cell.h4 { background: color-mix(in srgb, var(--brand) 78%, var(--surface-2)); }
.cell.h5 { background: var(--brand); }
.heat-legend { display: flex; gap: 3px; align-items: center; justify-content: flex-end; margin-top: 8px; font-size: .72rem; color: var(--muted); }
.heat-legend .cell { width: 12px; }
.insights { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.insights li { padding: 10px 14px; border-radius: var(--r-sm); background: var(--surface-2); border-inline-start: 3px solid var(--brand); font-size: .93rem; }
.insights .ins-weakSource, .insights .ins-lowRating, .insights .ins-idleVehicle, .insights .ins-lowRepeat { border-color: var(--bad); }
.insights .ins-bestSource, .insights .ins-topDriver, .insights .ins-topVehicle { border-color: var(--go); }
.ai-text { line-height: 1.6; }

/* QR campaigns */
.camp-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); margin-bottom: 16px; }
.camp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.bizcard { display: grid; grid-template-columns: 1fr 120px; gap: 14px; align-items: center; padding: 18px; background: #16181c; color: #fff; position: relative; aspect-ratio: 3.5 / 2; }
.bizcard::after { content: ''; position: absolute; inset-inline-start: 18px; bottom: 14px; width: 45%; height: 4px; background: repeating-linear-gradient(90deg, var(--brand) 0 18px, transparent 18px 30px); }
.bizcard div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.bizcard strong { font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; }
.bizcard span { font-size: .78rem; color: #c9ccd3; }
.bizcard .ph { color: #fff; font-weight: 700; margin-top: 6px; }
.bizcard em { font-style: normal; color: var(--brand); font-weight: 800; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; margin-top: 10px; }
.qr { width: 100%; height: auto; border-radius: 6px; background: #fff; display: block; }
.camp-body { padding: 14px 16px 16px; display: grid; gap: 10px; }
.camp-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.camp-stats div { background: var(--surface-2); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; min-width: 0; }
.camp-stats small { font-size: .65rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.camp-stats b { font-family: var(--font-mono); font-size: .9rem; overflow-wrap: anywhere; }
.url { font-size: .78rem; padding: 7px 9px; }

/* fleet, places, settings */
.fleet-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
.fleet-card { font: inherit; color: var(--fg); text-align: start; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
.fleet-card:hover { border-color: var(--line-2); }
.fleet-card .art, .veh-edit .art { height: 84px; display: grid; place-items: center; border-radius: 8px; background: var(--surface-3); overflow: hidden; margin-bottom: 4px; }
.fleet-card.off { opacity: .6; }
.fleet-card.add { border-style: dashed; align-items: center; justify-content: center; color: var(--muted); min-height: 160px; font-weight: 700; }
.fleet-card.add span { font-size: 2rem; line-height: 1; }
.veh-edit { display: grid; grid-template-columns: 180px 1fr; gap: 14px; align-items: center; }
.veh-edit > div:last-child { display: grid; gap: 8px; justify-items: start; }
@media (max-width: 520px) { .veh-edit { grid-template-columns: 1fr; } }
.peak { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px; border-radius: 8px; background: var(--surface-2); margin-bottom: 8px; font-size: .85rem; }
.peak input[type="number"] { width: 64px; padding: 6px; }
.peak label { display: inline-flex; gap: 6px; align-items: center; }
.days { display: flex; gap: 3px; flex-wrap: wrap; }
.daychk { position: relative; }
.daychk input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.daychk span { display: inline-block; padding: 4px 7px; border-radius: 6px; border: 1px solid var(--line); font-size: .75rem; cursor: pointer; }
.daychk input:checked + span { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.daychk input:focus-visible + span { outline: 2px solid var(--brand); }
.brand-edit { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin: 12px 0 16px; }
.logo-box { width: 72px; height: 72px; border-radius: 16px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 800; font-size: 1.8rem; overflow: hidden; }
.logo-box img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.tier-row { align-items: end; }

/* platform */
.tenant-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); margin-bottom: 16px; }
.tenant { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; box-shadow: var(--shadow); border-top: 4px solid var(--accent); }
.tenant.off { opacity: .65; }
.tenant header { display: flex; gap: 10px; align-items: center; }
.tenant header > div { flex: 1; min-width: 0; }
.swatch { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); flex: none; }
.mini-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 0; }
.mini-stats div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.mini-stats dt { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.mini-stats dd { margin: 0; font-family: var(--font-mono); font-weight: 700; }

/* ---------- driver app ---------- */
.driver { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
.drv-head { display: flex; align-items: center; gap: 12px; }
.drv-head > div:nth-child(2) { flex: 1; min-width: 0; }
.drv-head h1 { font-size: 1.4rem; }
.drv-switches { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3

  // QRErrorCorrectionLevel

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2

  //---------------------------------------------------------------------
  // QRMaskPattern

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

    function stepper(id, val) {

  function syncInputs() {
    $('#pickup').value = draft.pickup ? draft.pickup.name : '';
    $('#dropoff').value = draft.dropoff ? draft.dropoff.name : '';
    $('#flight').value = draft.flight; $('#meetGreet').checked = draft.meetGreet;
    $('#whenAt').value = draft.when; $('#returnAt').value = draft.returnWhen;
    $('#repeatFreq').value = draft.repeat.freq; $('#repeatCount').value = String(draft.repeat.count);
    ['name', 'phone', 'email', 'notes', 'promoCode', 'companyCode'].forEach(function (k) { $('#' + k).value = draft[k] || ''; });
    ['hours', 'passengers', 'bags', 'childSeats'].forEach(function (k) { $('#' + k).textContent = draft[k]; });
  }

  function syncVisibility() {
    var s = draft.service;
    $$('[data-svc]').forEach(function (b) { b.setAttribute('aria-checked', b.dataset.svc === s); });
    $$('[data-trip]').forEach(function (b) { b.setAttribute('aria-checked', b.dataset.trip === draft.tripType); });
    $$('[data-when]').forEach(function (b) { b.setAttribute('aria-checked', b.dataset.when === draft.whenMode); });
    $$('.vcard').forEach(function (c) { c.setAttribute('aria-checked', c.dataset.veh === draft.vehicleId); });
    $('#tripTypeSeg').hidden = s === 'hourly';
    $('#airportBox').hidden = s !== 'airport';
    $('#hoursBox').hidden = !(s === 'hourly' || s === 'event');
    $('#dropLbl').textContent = s === 'hourly' ? t('dropoffOpt') : t('dropoff');
    $('#whenAt').hidden = draft.whenMode !== 'later';
    $('#returnBox').hidden = !(draft.tripType === 'round' && s !== 'hourly');
    $('#repeatBox').hidden = draft.whenMode !== 'later';
    $('#repeatCount').hidden = !draft.repeat.freq;
    var places = App.cfg.places.filter(function (p) { return s === 'airport' ? p.type === 'airport' || p.type === 'hotel' : true; }).slice(0, 9);
    $('#chips').innerHTML = '<span class="chips-lbl">' + t('popular') + '</span>' + places.map(function (p) {
      return '<button type="button" class="chip" data-place="' + esc(p.id) + '"><i class="ptype t-' + p.type + '"></i>' + esc(p.name) + '</button>';
    }).join('');
    $$('.vcard').forEach(function (c) {
      var v = vehicle(c.dataset.veh), small = v && (draft.passengers > v.seats);
      $('[data-warn="' + c.dataset.veh + '"]').hidden = !small; c.classList.toggle('dim', !!small);
    });
    var pays = ['card', 'pos', 'transfer'].filter(function (m) { return App.cfg.payment[m]; });
    if (lastQuote && lastQuote.company && App.cfg.payment.invoice) pays.push('invoice');
    if (pays.indexOf(draft.payMethod) < 0) draft.payMethod = pays[0];
    $('#payOpts').innerHTML = pays.map(function (m) {
      return '<button type="button" role="radio" class="pay" data-pay="' + m + '" aria-checked="' + (draft.payMethod === m) + '"><span class="pay-ic">' + App.icon(PAY_IC[m] || 'card') + '</span><b>' + t('pm_' + m) + '</b><span>' + t('pmd_' + m) + '</span></button>';
    }).join('');
  }

  function bind() {
    var form = $('#bookForm');
    form.addEventListener('click', function (e) {
      var el = e.target.closest('button'); if (!el) return;
      var d = el.dataset;
      if (d.svc) { draft.service = d.svc; if (d.svc === 'airport' && draft.vehicleId === 'bus') draft.vehicleId = 'suv'; }
      else if (d.trip) draft.tripType = d.trip;
      else if (d.when) { draft.whenMode = d.when; if (d.when === 'later' && !draft.when) { draft.when = App.localInput(Date.now() + 2 * 3600e3).slice(0, 14) + '00'; $('#whenAt').value = draft.when; } }
      else if (d.veh) draft.vehicleId = d.veh;
      else if (d.pay) draft.payMethod = d.pay;
      else if (d.step) {
        var k = d.step, lim = { hours: [1, 24], passengers: [1, 60], bags: [0, 40], childSeats: [0, 4] }[k];
        draft[k] = Math.max(lim[0], Math.min(lim[1], draft[k] + Number(d.d)));
        $('#' + k).textContent = draft[k];
        if (k === 'passengers') autoVehicle();
      } else if (d.place) {
        var p = App.cfg.places.find(function (x) { return x.id === d.place; });
        draft[activeField] = { name: p.name, lat: p.lat, lng: p.lng, placeId: p.id };
        $('#' + activeField).value = p.name;
        activeField = activeField === 'pickup' ? 'dropoff' : 'pickup';
      } else if (el.id === 'swap') {
        var tmp = draft.pickup; draft.pickup = draft.dropoff; draft.dropoff = tmp; syncInputs();
      } else if (el.id === 'locate') return locate();
      else if (el.id === 'barPrice') { var bb = $('#barBreakdown'); bb.hidden = !bb.hidden; el.setAttribute('aria-expanded', String(!bb.hidden)); return; }
      else return;
      save(); syncVisibility(); refresh();
    });
    ['pickup', 'dropoff'].forEach(function (f) {
      var inp = $('#' + f);
      inp.addEventListener('focus', function () { activeField = f; });
      inp.addEventListener('input', function () { draft[f] = resolvePlace(inp.value, draft[f]); save(); refresh(); });
      inp.addEventListener('change', function () { geocode(f); });
    });
    var bindVal = function (id, key, after) { $('#' + id).addEventListener('input', function (e) { draft[key] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; save(); if (after) after(); }); };
    bindVal('name', 'name'); bindVal('phone', 'phone'); bindVal('email', 'email'); bindVal('notes', 'notes');
    bindVal('flight', 'flight'); bindVal('meetGreet', 'meetGreet', refresh);
    bindVal('whenAt', 'when', refresh); bindVal('returnAt', 'returnWhen', refresh);
    bindVal('promoCode', 'promoCode', refresh); bindVal('companyCode', 'companyCode', refresh);
    $('#meetGreet').addEventListener('change', function (e) { draft.meetGreet = e.target.checked; save(); refresh(); });
    $('#repeatFreq').addEventListener('change', function (e) { draft.repeat.freq = e.target.value; save(); syncVisibility(); });
    $('#repeatCount').addEventListener('change', function (e) { draft.repeat.count = +e.target.value; save(); });
    form.addEventListener('submit', function (e) { e.preventDefault(); review(); });
    $('#assistGo').addEventListener('click', assist);
    $('#assistText').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); assist(); } });
    $$('[data-fav]').forEach(function (b) {
      b.addEventListener('click', function () {
        var f = store.get('favorites', [])[+b.dataset.fav];
        Object.assign(draft, { pickup: f.pickup, dropoff: f.dropoff, vehicleId: f.vehicleId, service: f.service || 'point' });
        save(); syncInputs(); syncVisibility(); refresh();
        $('#whenAt').scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });
  }

  function autoVehicle() {
    var v = vehicle(draft.vehicleId);
    if (v && v.seats >= draft.passengers) return;
    var fit = App.cfg.vehicles.filter(function (x) { return x.seats >= draft.passengers; }).sort(function (a, b) { return a.seats - b.seats; })[0];
    if (fit) draft.vehicleId = fit.id;
  }

  function locate() {
    if (!navigator.geolocation) return App.toast(t('locationOff'));
    App.toast(t('locating'));
    navigator.geolocation.getCurrentPosition(function (pos) {
      draft.pickup = { name: t('myLocation') + ' (' + pos.coords.latitude.toFixed(4) + ', ' + pos.coords.longitude.toFixed(4) + ')', lat: pos.coords.latitude, lng: pos.coords.longitude };
      save(); syncInputs(); refresh();
    }, function () { App.toast(t('locationOff')); }, { enableHighAccuracy: true, timeout: 10000 });
  }

  // ---------- AI / smart assistant ----------
  function assist() {
    var text = $('#assistText').value.trim(); if (!text) return;
    var btn = $('#assistGo'); btn.disabled = true; btn.textContent = t('assistWorking');
    App.API.call('POST', '/api/assist', { text: text }).then(function (r) {
      btn.disabled = false; btn.textContent = t('assistGo');
      if (r.status !== 200) return App.toast(App.errText(r));
      var d = r.body.draft, filled = [];
      ['pickup', 'dropoff', 'passengers', 'bags', 'vehicleId', 'service', 'tripType', 'hours', 'flight', 'notes'].forEach(function (k) {
        if (d[k] != null && d[k] !== '') { draft[k] = d[k]; filled.push(k); }
      });
      if (d.when && d.when !== 'now') { draft.whenMode = 'later'; draft.when = App.localInput(Date.parse(d.when)); filled.push('when'); }
      else if (d.when === 'now') draft.whenMode = 'now';
      if (draft.service === 'airport' && draft.vehicleId === 'bus') draft.vehicleId = 'suv';
      autoVehicle(); save(); syncInputs(); syncVisibility(); refresh();
      var missing = ['pickup', 'dropoff', 'when'].filter(function (k) { return filled.indexOf(k) < 0 && !(k === 'dropoff' && draft.service === 'hourly'); });
      var rep = $('#assistReply'); rep.hidden = false;
      rep.textContent = d.reply || (filled.length ? t('assistFilled', { n: filled.length }) + (missing.length ? ' ' + t('assistMissing', { list: missing.map(function (k) { return t('f_' + k); }).join(', ') }) : '') : t('assistNothing'));
      $$('.flash').forEach(function (x) { x.classList.remove('flash'); });
      filled.forEach(function (k) { var el = $('#' + ({ when: 'whenAt', vehicleId: 'bookForm .vcard[aria-checked=true]' }[k] || k)); if (el) el.classList.add('flash'); });
    });
  }

  // ---------- live pricing ----------
  function refresh() {
    if (mapCtl) mapCtl.update({ pickup: draft.pickup, dropoff: draft.dropoff });
    clearTimeout(quoteTimer);
    quoteTimer = setTimeout(function () {
      App.API.call('POST', '/api/quote', tripBody()).then(function (r) {
        if (!$('#bookForm')) return;
        if (r.status !== 200) { lastQuote = null; return; }
        lastQuote = r.body; paintQuote();
      });
    }, 180);
  }

  function paintQuote() {
    var r = lastQuote, q = r.quote;
    Object.keys(r.perVehicle || {}).forEach(function (id) {
      var el = $('[data-price="' + id + '"]'); if (!el) return;
      var v = vehicle(id), total = r.perVehicle[id];
      el.textContent = total != null ? App.money(total) : t('from') + ' ' + App.money(v.minFare);
      el.classList.toggle('exact', total != null);
    });
    var price = $('#price');
    price.textContent = q && q.total != null ? App.money(q.total) : (draft.pickup && (draft.dropoff || draft.service === 'hourly') ? t('quoteLater') : '—');
    $('#miles').textContent = q && q.miles != null ? t('milesAway', { n: q.miles, m: q.minutes }) : '';
    $('#barBreakdown').innerHTML = q && q.total != null ? App.breakdownHtml(q, q.total) : '';
    var pm = $('#promoMsg'), cm = $('#companyMsg');
    var pe = r.errors && r.errors.promo;
    pm.textContent = draft.promoCode ? (pe ? t('err_' + pe) : t('codeApplied')) : '';
    pm.className = 'fld-msg ' + (pe ? 'bad' : 'good');
    cm.textContent = draft.companyCode ? (r.errors && r.errors.company ? t('err_company_invalid') : t('companyOk', { name: r.company })) : '';
    cm.className = 'fld-msg ' + (r.errors && r.errors.company ? 'bad' : 'good');
    var mb = $('#memberBox'), m = r.member;
    mb.hidden = !m;
    if (m) {
      mb.innerHTML = '<div><b>' + t('hiMember', { name: esc(m.name.split(' ')[0]) }) + '</b> <span class="pill tier">' + esc(m.tier ? m.tier.name : '') + '</span>' +
        '<small>' + t('pointsBalance', { n: m.points, v: App.money(m.pointsValue) }) + '</small></div>' +
        (m.points > 0 ? '<label class="toggle"><input type="checkbox" id="usePoints"' + (draft.usePoints ? ' checked' : '') + '> ' + t('usePoints') + '</label>' : '');
      var up = $('#usePoints'); if (up) up.onchange = function () { draft.usePoints = up.checked; save(); refresh(); };
    }
    var hadInvoice = !!$('[data-pay="invoice"]');
    if (hadInvoice !== !!(r.company && App.cfg.payment.invoice)) syncVisibility();
  }

  function validate() {
    var v = vehicle(draft.vehicleId);
    if (!v) return t('errVehicle');
    if (!draft.pickup) return t('errPickup');
    if (!draft.dropoff && draft.service !== 'hourly') return t('errRoute');
    if (draft.whenMode === 'later' && (!draft.when || Date.parse(draft.when) < Date.now())) return t('errWhen');
    if (draft.tripType === 'round' && draft.service !== 'hourly' && (!draft.returnWhen || (draft.when && Date.parse(draft.returnWhen) <= Date.parse(draft.when)))) return t('errReturn');
    if (draft.repeat.freq && draft.whenMode !== 'later') return t('err_repeat_needs_date');
    if (draft.passengers > v.seats) return t('errSeats', { n: v.seats });
    if (!draft.name.trim()) return t('errName');
    if (draft.phone.replace(/\D/g, '').length < 7) return t('errPhone');
    if (lastQuote && lastQuote.errors && lastQuote.errors.promo) return t('err_' + lastQuote.errors.promo);
    return null;
  }

  function review() {
    var e = validate(), box = $('#formError');
    box.hidden = !e; box.textContent = e || '';

  function readImage(file, max, type, cb) {

      img.onload = function () {
        var s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);

  function qrModules(text) {

    for (var r = 0; r < nn; r++) for (var k = 0; k < nn; k++) if (qr.isDark(r, k)) g.fillRect((k + q) * cell, (r + q) * cell, cell, cell);
    return c;
